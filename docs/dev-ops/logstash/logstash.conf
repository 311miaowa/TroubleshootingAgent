input {
  tcp {
    mode => "server"
    host => "0.0.0.0"
    port => 4560
    codec => json_lines
    type => "info"
  }
}
filter {}
output {
  elasticsearch {
      action => "index"
      # P1-3：ES 开启 basic auth 后必须带凭据（账号走容器环境变量 ES_USER / ES_PASSWORD）
      hosts => "elasticsearch:9200"
      user => "${ES_USER}"
      password => "${ES_PASSWORD}"
      index => "group-buy-market-log-%{+YYYY.MM.dd}"
    }
}
